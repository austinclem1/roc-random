# Redeploys the documentation site to GitHub Pages.
#
# The site is not checked into this repository; it is restored from the newest
# release that carries a `roc-random-docs-<version>.tar.gz` asset. Releases
# deploy Pages themselves, so this workflow is only for redeploying the current
# docs outside of a release (for example after a Pages settings change).
name: Deploy docs to GH Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Restore published docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/restore_published_docs.sh --output-dir www
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the restored www/ folder
          path: "./www"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
