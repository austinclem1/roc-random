# Opens a PR that repins the repository to the newest Roc nightly.
#
# The rest of CI installs the nightly pinned in examples/simple.roc, so the only
# way to exercise a newer compiler is to bump the pin. This workflow does not run
# the tests itself: a PR opened with GITHUB_TOKEN does not trigger `on:
# pull_request` runs, so run tests.yaml manually against the PR branch
# (Actions -> tests -> Run workflow -> pick the roc-nightly-* branch).
name: Bump Roc nightly

on:
  schedule:
    # Run daily at 11 AM UTC, after the nightlies are typically published.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: "Nightly tag to pin, e.g. nightly-2026-08-13-2fdd90e. Defaults to the newest nightly."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Resolve nightly version
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="$(gh release view --repo roc-lang/nightlies --json tagName --jq .tagName)"
          fi
          current="$(sed -n 's/.*roc: "\([^"]*\)".*/\1/p' examples/simple.roc | head -n 1)"
          branch="roc-$version"

          echo "Pinned:  $current"
          echo "Nightly: $version"

          skip=""
          if [ "$version" = "$current" ]; then
            skip="Already pinned to $version."
          elif git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            skip="Branch $branch already exists; not reopening it."
          fi

          if [ -n "$skip" ]; then
            echo "$skip"
            echo "$skip" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "version=$version"
            echo "branch=$branch"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      - name: Install Roc
        if: steps.nightly.outputs.skip == ''
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.nightly.outputs.version }}

      - name: Open bump PR
        if: steps.nightly.outputs.skip == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.nightly.outputs.version }}
          BRANCH: ${{ steps.nightly.outputs.branch }}
        run: |
          set -euo pipefail

          python3 scripts/update_roc_version.py --version "$VERSION"
          # A new nightly can change what the formatter wants, so carry any
          # reformatting into the PR rather than leaving it to fail there.
          roc fmt package examples
          if git diff --quiet; then
            echo "Nothing to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git commit --all --message "Pin Roc to $VERSION"
          git push origin "$BRANCH"

          body="$(cat <<EOF
          Repins the examples and flake.nix to [$VERSION](https://github.com/roc-lang/nightlies/releases/tag/$VERSION).

          Tests do not run automatically here, because this PR was opened by \`GITHUB_TOKEN\`.
          Run them from Actions -> tests -> Run workflow, against the \`$BRANCH\` branch.
          EOF
          )"

          url="$(gh pr create \
            --base "$GITHUB_REF_NAME" \
            --head "$BRANCH" \
            --title "Pin Roc to $VERSION" \
            --body "$body")"
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"
