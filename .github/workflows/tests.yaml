on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-examples:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Roc version
        id: roc
        run: |
          version="$(sed -n 's/.*roc: "\([^"]*\)".*/\1/p' examples/simple.roc | head -n 1)"
          if [ -z "$version" ]; then
            echo "examples/simple.roc does not pin a roc version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@f5a74bf90aa694b43ab4a7cbfdb19273bc6aa697
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ steps.roc.outputs.version }}

      - run: roc version

      - run: ./ci/all_tests.sh
